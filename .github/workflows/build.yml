# Har bir push'da setup.exe yig'iladi (Actions → Artifacts).
# "v1.0.3" kabi tag qo'yilganda esa avtomatik Release yaratiladi.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Kerakli dasturlarni o'rnatish
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis python3

      - name: Versiyani aniqlash
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Yig'ish
        run: bash build.sh "${{ steps.ver.outputs.v }}"

      - uses: actions/upload-artifact@v4
        with:
          name: uzbek-yangi-alifbo-${{ steps.ver.outputs.v }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Release yaratish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.v }}
          body_path: CHANGELOG.md
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
